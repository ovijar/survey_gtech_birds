<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Meta Tags -->
    <title>Survey PWA - Environmental Survey Data Collection</title>
    <meta name="description"
        content="Offline-first Progressive Web App for collecting environmental survey data with automatic sync to Google Sheets">
    <meta name="keywords" content="survey, environmental, offline, PWA, data collection">

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#B3A369">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Survey PWA">

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Survey PWA - Environmental Surveys">
    <meta property="og:description"
        content="Offline-first Progressive Web App for environmental survey data collection">
    <meta property="og:type" content="website">
    <meta property="og:image" content="./icons/icon-512.png">

    <!-- Manifest -->
    <link rel="manifest" href="./manifest.json">

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🌿 Environmental Survey</h1>
            <p>Offline-first data collection</p>
        </header>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-item">
                <span class="status-indicator online" id="statusIndicator"></span>
                <span id="statusText">Online</span>
            </div>

            <div class="status-item">
                <span>⏱️</span>
                <span class="timer-display" id="timerDisplay">05:00</span>
            </div>

            <div class="status-item">
                <span>📊 Pending:</span>
                <span class="pending-count" id="pendingCount">0</span>
            </div>
        </div>

        <!-- Survey Form - Multi-page -->
        <div class="form-card">
            <form id="surveyForm">
                <!-- Record ID (auto-generated) -->
                <input type="hidden" id="recordId" name="record_id">

                <!-- PAGE 1: General Information -->
                <div id="page1" class="form-page active">
                    <h2 class="page-title">Survey Information</h2>

                    <!-- Location -->
                    <div class="form-group">
                        <label for="pcLocationId">PC Location ID *</label>
                        <input type="text" id="pcLocationId" name="pc_location_id" required placeholder="e.g., LOC-001">
                    </div>

                    <!-- Date -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="day">Day *</label>
                            <input type="number" id="day" name="day" min="1" max="31" required placeholder="1-31">
                        </div>

                        <div class="form-group">
                            <label for="month">Month *</label>
                            <input type="number" id="month" name="month" min="1" max="12" required placeholder="1-12">
                        </div>

                        <div class="form-group">
                            <label for="year">Year *</label>
                            <input type="number" id="year" name="year" min="2020" max="2100" required
                                placeholder="2025">
                        </div>
                    </div>

                    <!-- Time & Observer -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="startTime">Start Time *</label>
                            <input type="time" id="startTime" name="start_time" required>
                        </div>

                        <div class="form-group">
                            <label for="observer">Observer *</label>
                            <input type="text" id="observer" name="observer" required placeholder="Observer name">
                        </div>
                    </div>

                    <!-- Navigation -->
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="resetBtn">
                            Reset Form
                        </button>
                        <button type="button" class="btn btn-primary" id="nextBtn">
                            Next: Species Observations →
                        </button>
                    </div>
                </div>

                <!-- PAGE 2: Species Observations -->
                <div id="page2" class="form-page">
                    <h2 class="page-title">Species Observations</h2>

                    <!-- Species Autocomplete -->
                    <div class="form-group">
                        <label for="speciesInput">Species *</label>
                        <div class="autocomplete-wrapper">
                            <div class="autocomplete-input-wrapper">
                                <input type="text" id="speciesInput" placeholder="Type to search species..."
                                    autocomplete="off">
                                <button type="button" class="btn btn-icon" id="addSpeciesBtn" title="Add species">
                                    +
                                </button>
                            </div>
                            <div id="speciesSuggestions" class="autocomplete-suggestions hidden"></div>
                        </div>

                        <!-- Selected Species Chips -->
                        <div class="species-chips" id="speciesChips"></div>

                        <!-- Hidden input to store selected species -->
                        <input type="hidden" id="species" name="species" required>
                    </div>

                    <!-- Distance & Directions -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="distance">Distance (meters)</label>
                            <input type="number" id="distance" name="distance" min="0" step="0.1"
                                placeholder="e.g., 50.5">
                        </div>

                        <div class="form-group">
                            <label for="directions">Directions</label>
                            <input type="text" id="directions" name="directions" placeholder="e.g., North, 45° NE">
                        </div>
                    </div>

                    <!-- Observation Details -->
                    <div class="form-group">
                        <label for="observationDetails">Observation Details</label>
                        <textarea id="observationDetails" name="observation_details" rows="3"
                            placeholder="Describe the observation..."></textarea>
                    </div>

                    <!-- Notes -->
                    <div class="form-group">
                        <label for="notes">Additional Notes</label>
                        <textarea id="notes" name="notes" rows="3" placeholder="Any additional notes..."></textarea>
                    </div>

                    <!-- Navigation -->
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="prevBtn">
                            ← Back to Survey Info
                        </button>
                        <button type="submit" class="btn btn-primary" id="submitBtn">
                            Submit Survey
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="./config.js"></script>
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.min.js"></script>
    <script src="./db.js"></script>
    <script src="./sync.js"></script>
    <script src="./navigation.js"></script>
    <script src="./app.js"></script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(registration => {
                        console.log('Service Worker registered:', registration);
                    })
                    .catch(error => {
                        console.error('Service Worker registration failed:', error);
                    });
            });
        }
    </script>
</body>

</html>
