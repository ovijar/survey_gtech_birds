<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- SEO Meta Tags -->
    <title>Survey PWA - Environmental Survey Data Collection</title>
    <meta name="description"
        content="Offline-first Progressive Web App for collecting environmental survey data with automatic sync to Google Sheets">
    <meta name="keywords" content="survey, environmental, offline, PWA, data collection">
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#B3A369">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Survey PWA">
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Survey PWA - Environmental Surveys">
    <meta property="og:description"
        content="Offline-first Progressive Web App for environmental survey data collection">
    <meta property="og:type" content="website">
    <meta property="og:image" content="./icons/icon-mbns.png">
    <!-- Manifest -->
    <link rel="manifest" href="./manifest.json">
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-mbns.png">
    <link rel="apple-touch-icon" href="./icons/icon-mbns.png">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="./styles.css?v=2">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <img src="./icons/icon-mbns.png" alt="Mountain Bird Network Survey Logo" class="header-logo"
                style="max-width: 100px; margin-bottom: 1rem;">
            <h1>Mountain Bird Network Survey</h1>
            <p>Data collection</p>
        </header>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-item">
                <span class="status-indicator online" id="statusIndicator"></span>
                <span id="statusText">Online</span>
            </div>
            <div class="status-item">
                <span>⏱️</span>
                <span class="timer-display" id="timerDisplay">05:00</span>
            </div>
            <div class="status-item">
                <span>📊 Pending:</span>
                <span class="pending-count" id="pendingCount">0</span>
            </div>
        </div>

        <!-- Survey Form - Multi-page -->
        <div class="form-card">
            <form id="surveyForm">
                <!-- Record ID (auto-generated) -->
                <input type="hidden" id="recordId" name="record_id">

                <!-- PAGE 1: General Information -->
                <div id="page1" class="form-page active">
                    <h2 class="page-title">Survey Information</h2>

                    <!-- Location -->
                    <div class="form-group">
                        <label for="pcLocationId">PC Location ID *</label>
                        <input type="text" id="pcLocationId" name="pc_location_id" required placeholder="e.g., LOC-001">
                    </div>

                    <!-- Date -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="day">Day *</label>
                            <input type="number" id="day" name="day" min="1" max="31" required placeholder="1-31">
                        </div>
                        <div class="form-group">
                            <label for="month">Month *</label>
                            <input type="number" id="month" name="month" min="1" max="12" required placeholder="1-12">
                        </div>
                        <div class="form-group">
                            <label for="year">Year *</label>
                            <input type="number" id="year" name="year" min="2020" max="2100" required
                                placeholder="2025">
                        </div>
                    </div>

                    <!-- Time & Observer -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="startTime">Start Time *</label>
                            <input type="time" id="startTime" name="start_time" required>
                        </div>
                        <div class="form-group">
                            <label for="observer">Observer *</label>
                            <input type="text" id="observer" name="observer" required placeholder="Observer name">
                        </div>
                    </div>

                    <!-- Navigation Buttons -->
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="resetBtn">Reset Form</button>
                        <button type="button" class="btn btn-primary" id="nextBtn">Next: Species Observations →</button>
                    </div>
                </div>

                <!-- PAGE 2: Species Observations -->
                <div id="page2" class="form-page">
                    <h2 class="page-title">Species Observations</h2>

                    <!-- Species Autocomplete -->
                    <div class="form-group">
                        <label for="speciesInput">Species *</label>
                        <div class="autocomplete-wrapper">
                            <div class="autocomplete-input-wrapper">
                                <input type="text" id="speciesInput" placeholder="Type to search species..."
                                    autocomplete="off">
                            </div>
                            <div id="speciesSuggestions" class="autocomplete-suggestions hidden"></div>
                        </div>
                        <div id="speciesChips" class="species-chips"></div>
                        <input type="hidden" id="species" name="species">
                    </div>

                    <!-- Observation Details -->
                    <div class="form-group">
                        <label for="distanceInput">Distance (m)</label>
                        <input type="number" id="distanceInput" placeholder="Enter distance" />
                    </div>
                    <div class="form-group">
                        <label for="directionsInput">Directions</label>
                        <input type="text" id="directionsInput" placeholder="Enter directions" />
                    </div>
                    <div class="form-group">
                        <label for="detailsInput">Observation Details</label>
                        <textarea id="detailsInput" placeholder="Enter details"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="notesInput">Notes</label>
                        <textarea id="notesInput" placeholder="Additional notes"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-primary" id="addMoreBtn">Add More</button>
                    </div>
                    <!-- Observations Review Panel -->
                    <div class="form-group">
                        <h3>Observations Review</h3>
                        <div id="observationsList" class="observations-list"></div>
                    </div>
                    <!-- Hidden field to submit observations JSON -->
                    <input type="hidden" id="observationsHidden" name="observations" />
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="./app.js"></script>
    <script src="./navigation.js"></script>

    <!-- Service Worker Registration -->
    <script>
        // Register Service Worker only when served over http/https (not file://)
        if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(registration => {
                        console.log('Service Worker registered:', registration);
                    })
                    .catch(error => {
                        console.error('Service Worker registration failed:', error);
                    });
            });
        } else {
            console.warn('Service Worker not registered: page loaded via file protocol');
        }
    </script>
</body>

</html>
